<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherVault - Ultra-Secure Text Encryption</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --dark: #2c3e50;
            --light: #f8f9fa;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        .container {
            margin-top: 2rem;
            margin-bottom: 2rem;
        }

        .card {
            border: none;
            border-radius: 1.2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 2rem;
            text-align: center;
        }

        .card-header h3 {
            margin: 0;
            font-weight: 700;
            font-size: 1.8rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .card-header i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .tab-content {
            padding: 2.5rem;
        }

        .nav-tabs {
            border: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            padding: 0.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(5px);
        }

        .nav-tabs .nav-link {
            border: none;
            border-radius: 0.8rem;
            color: white;
            font-weight: 600;
            padding: 0.8rem 1.8rem;
            transition: all 0.3s ease;
        }

        .nav-tabs .nav-link.active {
            background: rgba(255, 255, 255, 0.25);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .form-control, .form-label {
            color: white;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 0.8rem;
            padding: 0.8rem 1rem;
            color: white;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--success);
            box-shadow: 0 0 0 0.2rem rgba(46, 204, 113, 0.3);
            color: white;
        }

        .btn-action {
            border-radius: 0.8rem;
            padding: 0.9rem 2.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 1rem;
            transition: all 0.4s ease;
            margin: 0.5rem;
        }

        .btn-encrypt {
            background: linear-gradient(135deg, #00c853, #64dd17);
            border: none;
            color: white;
        }

        .btn-decrypt {
            background: linear-gradient(135deg, #ff1744, #f50057);
            border: none;
            color: white;
        }

        .btn-clear {
            background: linear-gradient(135deg, #78909c, #546e7a);
            border: none;
            color: white;
            font-size: 0.9rem;
            padding: 0.5rem 1.5rem;
        }

        .btn-copy {
            background: linear-gradient(135deg, #00bcd4, #009688);
            border: none;
            color: white;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
        }

        .btn-action:hover, .btn-clear:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .result-box {
            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 0.8rem;
            padding: 1.5rem;
            min-height: 130px;
            margin-top: 1.5rem;
            position: relative;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            color: #a8e6cf;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .card-header h3 { font-size: 1.5rem; }
            .btn-action { padding: 0.7rem 1.8rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-shield-lock"></i>
                        <h3>CipherVault</h3>
                        <p class="mb-0 mt-2">Military-grade encryption – unbreakable without the key</p>
                    </div>
                    
                    <div class="card-body p-0">
                        <ul class="nav nav-tabs justify-content-center" id="myTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="encrypt-tab" data-bs-toggle="tab" data-bs-target="#encrypt" type="button">
                                    <i class="fas fa-lock me-2"></i>Encrypt
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="decrypt-tab" data-bs-toggle="tab" data-bs-target="#decrypt" type="button">
                                    <i class="fas fa-unlock me-2"></i>Decrypt
                                </button>
                            </li>
                        </ul>
                        
                        <div class="tab-content" id="myTabContent">
                            <!-- Encrypt Tab -->
                            <div class="tab-pane fade show active" id="encrypt" role="tabpanel">
                                <div class="container-fluid">
                                    <div class="mb-3">
                                        <label for="encrypt-input" class="form-label">
                                            <i class="fas fa-file-alt me-2"></i>Data to encrypt
                                        </label>
                                        <textarea class="form-control" id="encrypt-input" rows="5" placeholder="Enter any data (text, JSON, passwords, etc.)"></textarea>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="encrypt-key" class="form-label">
                                            <i class="fas fa-key me-2"></i>Encryption key (required)
                                        </label>
                                        <input type="password" class="form-control" id="encrypt-key" placeholder="Enter a strong key (min 6 characters)">
                                        <small class="text-warning mt-1"><i class="fas fa-info-circle"></i> Longer key = stronger security</small>
                                    </div>
                                    
                                    <div class="text-center">
                                        <button type="button" class="btn btn-action btn-encrypt" id="btn-encrypt">
                                            <i class="fas fa-shield-alt me-2"></i>ENCRYPT NOW
                                        </button>
                                        <button type="button" class="btn btn-clear" id="btn-clear-encrypt">
                                            <i class="fas fa-trash-alt me-2"></i>CLEAR ALL
                                        </button>
                                    </div>
                                    
                                    <div class="mt-4">
                                        <label class="form-label">
                                            <i class="fas fa-lock-open me-2"></i>Encrypted result
                                        </label>
                                        <div class="result-box" id="encrypt-result">
                                            <em>Result will appear here...</em>
                                        </div>
                                        <div class="text-end mt-2">
                                            <button type="button" class="btn btn-sm btn-copy" id="copy-encrypt">
                                                <i class="fas fa-copy"></i> Copy
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Decrypt Tab -->
                            <div class="tab-pane fade" id="decrypt" role="tabpanel">
                                <div class="container-fluid">
                                    <div class="mb-3">
                                        <label for="decrypt-input" class="form-label">
                                            <i class="fas fa-file-code me-2"></i>Encrypted data
                                        </label>
                                        <textarea class="form-control" id="decrypt-input" rows="5" placeholder="Paste encrypted string here..."></textarea>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="decrypt-key" class="form-label">
                                            <i class="fas fa-key me-2"></i>Decryption key (must match exactly)
                                        </label>
                                        <input type="password" class="form-control" id="decrypt-key" placeholder="Enter the same key used for encryption">
                                    </div>
                                    
                                    <div class="text-center">
                                        <button type="button" class="btn btn-action btn-decrypt" id="btn-decrypt">
                                            <i class="fas fa-unlock-alt me-2"></i>DECRYPT NOW
                                        </button>
                                        <button type="button" class="btn btn-clear" id="btn-clear-decrypt">
                                            <i class="fas fa-trash-alt me-2"></i>CLEAR ALL
                                        </button>
                                    </div>
                                    
                                    <div class="mt-4">
                                        <label class="form-label">
                                            <i class="fas fa-file-check me-2"></i>Original result
                                        </label>
                                        <div class="result-box" id="decrypt-result">
                                            <em>Result will appear here...</em>
                                        </div>
                                        <div class="text-end mt-2">
                                            <button type="button" class="btn btn-sm btn-copy" id="copy-decrypt">
                                                <i class="fas fa-copy"></i> Copy
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="footer mt-4">
                    <p>© 2025 <strong>CipherVault</strong> – Unbreakable encryption</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // XOR function
        function xor(str, key) {
            let result = '';
            for (let i = 0; i < str.length; i++) {
                result += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return result;
        }

        // Vigenère cipher
        function vigenere(text, key, encrypt = true) {
            key = key.replace(/[^a-zA-Z]/g, '').toUpperCase();
            if (!key) return text;
            let result = '', k = 0;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (/[a-zA-Z]/.test(c)) {
                    let base = c <= 'Z' ? 65 : 97;
                    let shift = key.charCodeAt(k % key.length) - 65;
                    if (c > 'Z') shift = key.charCodeAt(k % key.length) - 97;
                    let offset = encrypt ? shift : -shift;
                    result += String.fromCharCode(((c.charCodeAt(0) - base + offset) % 26 + 26) % 26 + base);
                    k++;
                } else {
                    result += c;
                }
            }
            return result;
        }

        // Caesar cipher
        function caesar(text, shift, encrypt = true) {
            shift = parseInt(shift) || 7;
            if (!encrypt) shift = -shift;
            return text.replace(/[a-zA-Z]/g, c => {
                const base = c <= 'Z' ? 65 : 97;
                return String.fromCharCode(((c.charCodeAt(0) - base + shift) % 26 + 26) % 26 + base);
            });
        }

        // Base64
        function b64e(str) { 
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p) => String.fromCharCode('0x' + p))); 
        }
        function b64d(str) { 
            try { 
                return decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')); 
            } catch { return null; }
        }

        // ENCRYPT: 4 layers
        function encryptData(text, key) {
            if (!key) throw new Error("Key cannot be empty!");
            let step1 = xor(text, key);
            let step2 = vigenere(step1, key);
            let step3 = caesar(step2, key.length);
            return b64e(step3);
        }

        // DECRYPT: 4 layers reversed
        function decryptData(encrypted, key) {
            if (!key) throw new Error("Key cannot be empty!");
            let step1 = b64d(encrypted);
            if (!step1) throw new Error("Invalid encrypted data!");
            let step2 = caesar(step1, key.length, false);
            let step3 = vigenere(step2, key, false);
            return xor(step3, key);
        }

        // Handle encryption
        document.getElementById('btn-encrypt').addEventListener('click', () => {
            const input = document.getElementById('encrypt-input').value;
            const key = document.getElementById('encrypt-key').value;
            const resultBox = document.getElementById('encrypt-result');

            if (!input.trim()) return resultBox.innerHTML = '<em class="text-danger">Please enter data to encrypt!</em>';
            if (!key || key.length < 4) return resultBox.innerHTML = '<em class="text-danger">Key must be at least 4 characters!</em>';

            try {
                const encrypted = encryptData(input, key);
                resultBox.textContent = encrypted;
            } catch (e) {
                resultBox.innerHTML = `<em class="text-danger">Error: ${e.message}</em>`;
            }
        });

        // Handle decryption
        document.getElementById('btn-decrypt').addEventListener('click', () => {
            const input = document.getElementById('decrypt-input').value.trim();
            const key = document.getElementById('decrypt-key').value;
            const resultBox = document.getElementById('decrypt-result');

            if (!input) return resultBox.innerHTML = '<em class="text-danger">Please paste encrypted data!</em>';
            if (!key || key.length < 4) return resultBox.innerHTML = '<em class="text-danger">Key must be at least 4 characters!</em>';

            try {
                const decrypted = decryptData(input, key);
                resultBox.textContent = decrypted;
            } catch (e) {
                resultBox.innerHTML = `<em class="text-danger">Decryption failed: ${e.message}</em>`;
            }
        });

        // CLEAR ALL - Encrypt Tab
        document.getElementById('btn-clear-encrypt').addEventListener('click', () => {
            document.getElementById('encrypt-input').value = '';
            document.getElementById('encrypt-key').value = '';
            document.getElementById('encrypt-result').innerHTML = '<em>Result will appear here...</em>';
        });

        // CLEAR ALL - Decrypt Tab
        document.getElementById('btn-clear-decrypt').addEventListener('click', () => {
            document.getElementById('decrypt-input').value = '';
            document.getElementById('decrypt-key').value = '';
            document.getElementById('decrypt-result').innerHTML = '<em>Result will appear here...</em>';
        });

        // Copy result
        function copyResult(id, btnId) {
            const text = document.getElementById(id).textContent;
            if (text && !text.includes('Result') && !text.includes('Error')) {
                navigator.clipboard.writeText(text);
                const btn = document.getElementById(btnId);
                const original = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                setTimeout(() => btn.innerHTML = original, 2000);
            }
        }

        document.getElementById('copy-encrypt').addEventListener('click', () => copyResult('encrypt-result', 'copy-encrypt'));
        document.getElementById('copy-decrypt').addEventListener('click', () => copyResult('decrypt-result', 'copy-decrypt'));
    </script>
</body>
</html>
